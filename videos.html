<script>
(function(){
  var fallback='https://wakelet.com/wake/-hoKD1NmWkkzTqJGR6X56';
  function show(url){
    var m=String(url||fallback).match(/wake[s]?\/([\w-]+)/);
    document.getElementById('wake').src='https://embed.wakelet.com/wakes/'+(m?m[1]:'-hoKD1NmWkkzTqJGR6X56')+'/grid';
  }
  fetch('content.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(C){show(C.wakelet);}).catch(function(){show();});
})();
</script>
