# Settings for the Pages CMS editor (app.pagescms.org). You don't need to edit this file.
# Tip: in any text box, write [words](https://link) to turn those words into a link, and **words** to make them bold.
media:
  input: images
  output: images

content:
  - name: website
    label: Website content
    type: file
    path: content.json
    format: json
    fields:
      - name: hero
        label: Top of the page
        type: object
        fields:
          - { name: eyebrow, label: Small line above the headline, type: string }
          - { name: headline1, label: Headline (first line), type: string }
          - { name: headline2, label: Headline (second line, in colour), type: string }
          - { name: intro1, label: Intro sentence (larger), type: text }
          - { name: intro2, label: Intro paragraph, type: text }
          - { name: years, label: Experience line (smaller), type: text }
          - { name: photo, label: Your photo, type: image }
          - { name: photoCaption, label: Caption under your photo, type: string }
          - { name: button1, label: First button text, type: string }
          - { name: button2, label: Second button text, type: string }

      - name: highlights
        label: Highlights strip (names under the intro)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: name, label: Name, type: string }
          - { name: link, label: "Link (optional) - full web address starting with https://", type: string }
          - { name: highlight, label: Show in colour, type: boolean }

      - name: numbers
        label: Big numbers (4 boxes)
        type: object
        list:
          min: 1
          max: 4
          collapsible:
            collapsed: true
            summary: "{value}"
        fields:
          - { name: value, label: Big number, type: string }
          - { name: label, label: Line under it, type: text }

      - name: latest
        label: Featured work - second row (landscape videos) - best first
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} ({date})"
        fields:
          - { name: title, label: Title, type: string }
          - { name: date, label: Month and year, type: string }
          - { name: tags, label: "Tags (e.g. Reel, Climate, Instagram)", type: string, list: true }
          - { name: role, label: Your role in one line, type: string }
          - { name: result, label: "Result (e.g. 1.2M views) - optional", type: string }
          - { name: youtube, label: "YouTube link - plays on your site", type: string }
          - { name: link, label: "Or: Instagram / LinkedIn / other link - opens in a new tab", type: string }
          - { name: video, label: "Or: upload a video file (under 25 MB)", type: file, options: { categories: [ video ] } }
          - { name: thumb, label: "Cover image (not needed for YouTube)", type: image }

      - name: latestReels
        label: Featured work - top row (vertical Reels) - best first
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: title, label: Title, type: string }
          - { name: tag, label: "Tag (e.g. Climate)", type: string }
          - { name: youtube, label: "YouTube or YouTube Shorts link - plays on your site", type: string }
          - { name: link, label: "Or: Instagram / LinkedIn / other link", type: string }
          - { name: video, label: "Or: upload a video file (under 25 MB)", type: file, options: { categories: [ video ] } }
          - { name: thumb, label: "Cover image (needed for Instagram links)", type: image }

      - name: reels
        label: Video wall (vertical Reels slider)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: title, label: Title, type: string }
          - { name: tag, label: "Tag (e.g. Climate)", type: string }
          - { name: youtube, label: "YouTube link - plays on your site", type: string }
          - { name: link, label: "Or: Instagram / LinkedIn / other link", type: string }
          - { name: video, label: "Or: upload a video file (under 25 MB)", type: file, options: { categories: [ video ] } }
          - { name: thumb, label: "Cover image (not needed for YouTube)", type: image }

      - name: graphics
        label: Graphics slider (images 1080 x 1350)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - { name: image, label: "Graphic (1080 x 1350, JPG)", type: image }
          - { name: caption, label: "Caption (optional)", type: string }
          - { name: link, label: "Link (optional) - e.g. the Instagram post", type: string }
          - { name: account, label: "Account name (optional) - e.g. undp, shown above the graphic", type: string }
          - { name: embed, label: "Open the Instagram post in a pop-up (tick for Instagram links)", type: boolean }

      - { name: graphicsMore, label: "\"Click for more\" link under the graphics (e.g. your Instagram or a Behance page)", type: string }

      - name: work
        label: Work experience (case studies) - top one shows first
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: title, label: Title, type: string }
          - { name: meta, label: "Small line above the title (organisation · role · years · city)", type: string }
          - { name: image, label: "Photo (wide, 3:2)", type: image }
          - { name: brief, label: The brief, type: text }
          - { name: did, label: What I did, type: text }
          - { name: result, label: "Result (leave empty to hide)", type: text }
          - { name: award, label: "Green badge text (optional, e.g. Webby Award Winner)", type: string }
          - { name: showFeaturedIn, label: "Show the 'Featured in' press list in this case", type: boolean }

      - name: writing
        label: Writing (articles and blogs)
        type: object
        fields:
          - { name: intro, label: Intro line, type: text }
          - name: items
            label: Articles
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Title, type: string }
              - { name: label, label: "Small label (e.g. UNDP blog · Climate)", type: string }
              - { name: link, label: Link to the article, type: string }
              - { name: image, label: "Cover image (wide, e.g. 1200 x 750)", type: image }
          - { name: authorPage, label: "\"All my stories\" button link", type: string }
          - { name: authorButton, label: "\"All my stories\" button text", type: string }

      - name: about
        label: About section
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: paragraphs, label: Paragraphs, type: text, list: true }
          - name: photos
            label: Photo slider
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{caption}"
            fields:
              - { name: src, label: Photo, type: image }
              - { name: caption, label: Caption, type: string }

      - name: caseImages
        label: Work experience photos
        type: object
        fields:
          - { name: undpGlobal, label: UNDP global, type: image }
          - { name: undpIndia, label: UNDP India, type: image }
          - { name: deported, label: The Deported, type: image }
          - { name: counting, label: "#14000andCounting", type: image }
          - { name: syria, label: Syria documentary, type: image }

      - name: sections
        label: "Section headings and small labels"
        type: object
        fields:
          - { name: featured, label: "\"Featured work\" heading", type: string }
          - { name: videosLabel, label: "Video wall - small line above heading", type: string }
          - { name: videos, label: "Video wall - heading", type: string }
          - { name: videosButton, label: "Video wall - button text", type: string }
          - { name: graphicsLabel, label: "Graphics - small line above heading", type: string }
          - { name: graphics, label: "Graphics - heading", type: string }
          - { name: graphicsMoreText, label: "Graphics - \"Click for more\" text", type: string }
          - { name: work, label: "Work experience - heading", type: string }
          - { name: workIntro, label: "Work experience - line next to heading (optional)", type: text }
          - { name: writing, label: "Writing - heading", type: string }
          - { name: aboutLabel, label: "About - small label", type: string }
          - { name: photoTag, label: "About - tag on the photo slider", type: string }
      - name: whatIDo
        label: "\"What I do\" section"
        type: object
        fields:
          - { name: heading, label: "Heading", type: string }
          - { name: intro, label: "Line next to the heading", type: text }
          - name: tiles
            label: Tiles
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
              - { name: proof, label: "Proof line (small, at the bottom)", type: string }
      - name: recognition
        label: "Recognition (awards)"
        type: object
        fields:
          - { name: heading, label: "Heading", type: string }
          - { name: intro, label: "Line next to the heading", type: text }
          - name: awards
            label: Awards
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{year} {title}"
            fields:
              - { name: year, label: Year, type: string }
              - { name: title, label: Award, type: string }
              - { name: detail, label: Detail, type: text }
              - { name: highlight, label: Show in colour, type: boolean }
          - { name: orgsLabel, label: "\"Organisations I've worked with\" label", type: string }
      - name: lab
        label: "New media lab"
        type: object
        fields:
          - { name: label, label: "Small label", type: string }
          - { name: heading, label: "Heading", type: string }
          - { name: intro, label: "Intro", type: text }
          - name: items
            label: Boxes
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
              - { name: proof, label: "Proof line (small)", type: string }
      - name: skills
        label: "Skills & education"
        type: object
        fields:
          - { name: heading, label: "Heading", type: string }
          - { name: intro, label: "Line next to the heading (optional)", type: text }
          - name: groups
            label: Groups
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - { name: label, label: Small label, type: string }
              - { name: text, label: Text, type: text }
              - { name: wide, label: "Full width (use for Education)", type: boolean }
      - name: offTheClock
        label: "Off the clock (travel creator band)"
        type: object
        fields:
          - { name: label, label: "Small label", type: string }
          - { name: heading, label: "Heading", type: string }
          - { name: paragraphs, label: "Paragraphs", type: text, list: true }
          - { name: buttonText, label: "Button text", type: string }
          - { name: buttonLink, label: "Button link", type: string }
      - { name: footer, label: Footer line at the very bottom, type: string }

      - { name: travelPhoto, label: "Travel photo (\"I'm also a travel creator\" band)", type: image }

      - name: contact
        label: Contact
        type: object
        fields:
          - { name: label, label: Small label, type: string }
          - { name: heading1, label: Heading (first line), type: string }
          - { name: heading2, label: "Heading (second line, last word in colour)", type: string }
          - { name: line, label: Contact text, type: text }
          - { name: email, label: Email, type: string }
          - { name: linkedin, label: LinkedIn profile link, type: string }
          - { name: cv, label: CV (PDF), type: file }
          - { name: cvButton, label: CV button text, type: string }
          - { name: linkedinButton, label: LinkedIn button text, type: string }

      - { name: wakelet, label: "Wakelet link for the Video wall page", type: string }

      - name: featuredIn
        label: Featured in (press names)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: name, label: Name, type: string }
          - { name: link, label: "Link to the article (optional)", type: string }

      - name: organisations
        label: Organisations I've worked with
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: name, label: Name, type: string }
          - { name: link, label: "Link (optional)", type: string }
